name: Send WhatsApp Notice

on:
  repository_dispatch:
    types: [send_notice]

jobs:
  send_whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp Document Notice
        run: |
          python3 -c "
          import urllib.request, json

          raw = '${{ github.event.client_payload.phone }}'.strip().replace('+', '').replace(' ', '')
          phone = '91' + raw if len(raw) == 10 else raw

          p_name = '${{ github.event.client_payload.person_name }}'
          cat = '${{ github.event.client_payload.category }}'
          ref = '${{ github.event.client_payload.ref_no }}'
          due = '${{ github.event.client_payload.due_date }}'
          file_url = '${{ github.event.client_payload.file_url }}'.strip()

          phone_number_id = '1290612987479644'
          token = '${{ secrets.WHATSAPP_TOKEN }}'

          if not file_url or not file_url.startswith('http'):
              file_url = 'https://raw.githubusercontent.com/vijiyadav86-yogya/What-s-app-peddavadagur-mandal-/main/sample_notice.pdf'

          # 1. అకౌంట్ లో ఉన్న అప్రూవ్డ్ టెంప్లేట్ల లిస్ట్ తనిఖీ
          print('--- CHECKING AVAILABLE TEMPLATES ---')
          try:
              waba_req = urllib.request.Request(
                  f'https://graph.facebook.com/v19.0/{phone_number_id}?fields=whatsapp_business_management',
                  headers={'Authorization': f'Bearer {token}'}
              )
          except:
              pass

          # 2. తెలుగు, ఇంగ్లీష్ లాంగ్వేజ్ కోడ్‌లతో టెంప్లేట్ పంపే ప్రయత్నం
          url = f'https://graph.facebook.com/v19.0/{phone_number_id}/messages'
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json'
          }

          # సాధ్యమయ్యే అన్ని లాంగ్వేజ్ కోడ్స్ (Telugu & English)
          test_langs = ['te', 'te_IN', 'en', 'en_US']
          delivered = False

          for lang in test_langs:
              print(f'Trying template delivery with language: {lang}...')
              payload = {
                  'messaging_product': 'whatsapp',
                  'recipient_type': 'individual',
                  'to': phone,
                  'type': 'template',
                  'template': {
                      'name': 'revenue_pdf_notice',
                      'language': {'code': lang},
                      'components': [
                          {
                              'type': 'header',
                              'parameters': [
                                  {
                                      'type': 'document',
                                      'document': {
                                          'link': file_url,
                                          'filename': 'Revenue_Notice.pdf'
                                      }
                                  }
                              ]
                          },
                          {
                              'type': 'body',
                              'parameters': [
                                  {'type': 'text', 'text': p_name},
                                  {'type': 'text', 'text': cat},
                                  {'type': 'text', 'text': ref},
                                  {'type': 'text', 'text': due}
                              ]
                          }
                      ]
                  }
              }

              req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f'✅ SUCCESSFUL! Delivered with language [{lang}]:', resp.read().decode())
                      delivered = True
                      break
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode()
                  print(f'Failed for [{lang}]: {err_body}')

          if not delivered:
              print('❌ All template variations failed.')
              exit(1)
          "
