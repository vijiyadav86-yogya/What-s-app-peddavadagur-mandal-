name: Send WhatsApp Notice

on:
  repository_dispatch:
    types: [send_notice]

jobs:
  send_whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp Notice
        run: |
          python3 -c "
          import urllib.request, json

          raw = '${{ github.event.client_payload.phone }}'.strip().replace('+', '').replace(' ', '')
          phone = '91' + raw if len(raw) == 10 else raw

          msg = '''${{ github.event.client_payload.message }}'''
          file_url = '${{ github.event.client_payload.file_url }}'.strip()
          file_name = '${{ github.event.client_payload.file_name }}'.strip() or 'Revenue_Notice.pdf'

          url = 'https://graph.facebook.com/v19.0/1290612987479644/messages'
          headers = {
              'Authorization': 'Bearer ${{ secrets.WHATSAPP_TOKEN }}',
              'Content-Type': 'application/json'
          }

          # ఫైల్ ఉన్నప్పుడు నేరుగా డాక్యుమెంట్ లేదా ఇమేజ్‌గా పంపడం
          if file_url and file_url.startswith('http'):
              is_img = any(file_url.lower().endswith(ext) for ext in ['.jpg', '.jpeg', '.png'])
              if is_img:
                  data = {
                      'messaging_product': 'whatsapp',
                      'recipient_type': 'individual',
                      'to': phone,
                      'type': 'image',
                      'image': {
                          'link': file_url,
                          'caption': msg
                      }
                  }
              else:
                  data = {
                      'messaging_product': 'whatsapp',
                      'recipient_type': 'individual',
                      'to': phone,
                      'type': 'document',
                      'document': {
                          'link': file_url,
                          'caption': msg,
                          'filename': file_name
                      }
                  }
          else:
              data = {
                  'messaging_product': 'whatsapp',
                  'recipient_type': 'individual',
                  'to': phone,
                  'type': 'text',
                  'text': {'body': msg}
              }

          req = urllib.request.Request(url, data=json.dumps(data).encode('utf-8'), headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Success:', resp.read().decode())
          except urllib.error.HTTPError as e:
              print('Error:', e.read().decode())
              exit(1)
          "
