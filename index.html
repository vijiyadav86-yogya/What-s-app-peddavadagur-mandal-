<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #2d3bb4;
      --primary-dark: #1f2a8a;
      --accent: #f59e0b;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }
    
    /* Header Banner */
    .header-banner {
      background: linear-gradient(135deg, #2d3bb4, #3b4cca);
      color: white;
      padding: 24px 20px;
      margin: 15px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 25px -5px rgba(45, 59, 180, 0.3);
    }
    .header-banner i.header-icon {
      font-size: 2.4rem;
      background: rgba(255, 255, 255, 0.15);
      padding: 12px;
      border-radius: 14px;
    }
    .header-titles h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .header-titles p { font-size: 0.85rem; opacity: 0.9; }

    /* Container Card */
    .form-card {
      background: var(--card-bg);
      margin: 15px;
      padding: 22px 18px;
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .card-head h2 { font-size: 1.15rem; font-weight: 700; color: #1e293b; }
    .btn-contacts {
      background: #e0e7ff;
      color: #3730a3;
      border: none;
      padding: 7px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Form Fields */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }
    .required { color: #ef4444; }

    /* Yellow Box for Category */
    .category-box {
      border: 2px solid #facc15;
      background: #fefce8;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .category-title {
      color: #b45309;
      font-weight: 700;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .form-control, .form-select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 59, 180, 0.15);
    }

    /* Phone Input Box */
    .phone-input-group {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .phone-prefix {
      background: #f8fafc;
      padding: 12px 14px;
      font-weight: 700;
      color: #475569;
      border-right: 1.5px solid var(--border);
    }
    .phone-input-group input {
      border: none;
      padding: 12px 14px;
      width: 100%;
      outline: none;
      font-size: 0.95rem;
    }

    /* Attachments Box */
    .attachment-box {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .attachment-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #334155;
    }
    .attachment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn-attach {
      border: none;
      color: white;
      padding: 14px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-camera { background: #059669; }
    .btn-pdf { background: #4338ca; }
    .btn-attach i { font-size: 1.4rem; }

    /* Date & Due Days */
    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 20px;
    }

    /* Main WhatsApp Action Button */
    .btn-send {
      width: 100%;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px -4px rgba(22, 163, 74, 0.4);
      cursor: pointer;
    }
    .btn-send:active { transform: scale(0.98); }

    /* Status Alert */
    #statusAlert {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
      text-align: center;
    }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>

  <!-- Top Blue Header Banner -->
  <div class="header-banner">
    <i class="bi bi-bank2 header-icon"></i>
    <div class="header-titles">
      <h1>తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు</h1>
      <p>అధికారిక రికార్డుల & నోటీస్ ట్రాకర్</p>
    </div>
  </div>

  <!-- Form Container -->
  <div class="form-card">
    <div class="card-head">
      <h2>కొత్త ఎంట్రీ & నోటీస్</h2>
      <button class="btn-contacts" type="button" onclick="alert('కాంటాక్ట్ లిస్ట్ త్వరలో అందుబాటులోకి వస్తుంది')">
        <i class="bi bi-person-lines-fill"></i> కాంటాక్ట్స్
      </button>
    </div>

    <!-- Category Box -->
    <div class="category-box">
      <div class="category-title">
        <i class="bi bi-list-task"></i> విభాగం ఎంచుకోండి (Category) <span class="required">*</span>
      </div>
      <select class="form-select" id="categorySelect">
        <option value="">-- ఎంచుకోండి (Select Category) --</option>
        <option value="మ్యుటేషన్ / పట్టాదారు పాస్ పుస్తకం">మ్యుటేషన్ / పట్టాదారు పాస్ పుస్తకం</option>
        <option value="స్పందన / పీపుల్స్ గ్రీవెన్స్ అర్జీ">స్పందన / పీపుల్స్ గ్రీవెన్స్ అర్జీ</option>
        <option value="సర్వే / సరిహద్దుల వివాదం">సర్వే / సరిహద్దుల వివాదం</option>
        <option value="భూ సేకరణ / అవార్డు విచారణ">భూ సేకరణ / అవార్డు విచారణ</option>
        <option value="ఇతర అధికారిక రెవెన్యూ నోటీస్">ఇతర అధికారిక రెవెన్యూ నోటీస్</option>
      </select>
    </div>

    <!-- Recipient Name -->
    <div class="form-group">
      <label class="form-label">గ్రహీత పేరు (VRO / Person) <span class="required">*</span></label>
      <input type="text" class="form-control" id="personName" placeholder="ఉదా: రాజేష్" value="రాజేష్">
    </div>

    <!-- WhatsApp Number -->
    <div class="form-group">
      <label class="form-label">WhatsApp నంబర్ <span class="required">*</span></label>
      <div class="phone-input-group">
        <span class="phone-prefix">+91</span>
        <input type="tel" id="phoneNumber" placeholder="9876543210" value="8688421131">
      </div>
    </div>

    <!-- Document Reference Number -->
    <div class="form-group">
      <label class="form-label">డాక్యుమెంట్ / రిఫరెన్స్ నంబర్ <span class="required">*</span></label>
      <input type="text" class="form-control" id="refNumber" placeholder="ఉదా: F-8 నంబర్ / అర్జీ వివరాలు" value="F-8/2026/నోటీస్-12">
    </div>

    <!-- File Attachments Box -->
    <div class="attachment-box">
      <div class="attachment-title">📸 డాక్యుమెంట్ ఫోటో లేదా PDF జతచేయండి:</div>
      <div class="attachment-grid">
        <label class="btn-attach btn-camera">
          <i class="bi bi-camera"></i> కెమెరా ఓపెన్ చేయి
          <input type="file" accept="image/*" capture="environment" style="display: none;" onchange="alert('ఫోటో సెలెక్ట్ చేయబడింది!')">
        </label>
        <label class="btn-attach btn-pdf">
          <i class="bi bi-file-earmark-pdf"></i> PDF / ఫైల్స్
          <input type="file" accept="application/pdf,image/*" style="display: none;" onchange="alert('ఫైల్ సెలెక్ట్ చేయబడింది!')">
        </label>
      </div>
    </div>

    <!-- Days & Due Date -->
    <div class="date-row">
      <div>
        <label class="form-label">గడువు రోజులు</label>
        <select class="form-select" id="dueDays" onchange="updateDueDate()">
          <option value="3">3 రోజులు</option>
          <option value="7" selected>7 రోజులు</option>
          <option value="15">15 రోజులు</option>
          <option value="30">30 రోజులు</option>
        </select>
      </div>
      <div>
        <label class="form-label">గడువు తేదీ (Due Date)</label>
        <input type="date" class="form-control" id="dueDate">
      </div>
    </div>

    <!-- Submit Action Button -->
    <button class="btn-send" id="sendBtn" onclick="sendWhatsAppNotice()">
      <i class="bi bi-whatsapp"></i> వాట్సాప్‌కు నోటీస్ పంపు
    </button>

    <div id="statusAlert"></div>
  </div>

  <script>
    // సెట్ ప్రస్తుత గడువు తేదీ
    function updateDueDate() {
      const days = parseInt(document.getElementById('dueDays').value) || 7;
      const today = new Date();
      today.setDate(today.getDate() + days);
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('dueDate').value = `${yyyy}-${mm}-${dd}`;
    }
    updateDueDate();

    // GitHub Actions API మీదుగా వాట్సాప్ పంపే ఫంక్షన్
    async function sendWhatsAppNotice() {
      const category = document.getElementById('categorySelect').value;
      const name = document.getElementById('personName').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();
      const ref = document.getElementById('refNumber').value.trim();
      const dueDate = document.getElementById('dueDate').value;
      const sendBtn = document.getElementById('sendBtn');
      const alertBox = document.getElementById('statusAlert');

      if (!name || !phone || !ref) {
        alert("దయచేసి అన్ని వివరాలను నమోదు చేయండి!");
        return;
      }

      const noticeMessage = `🏛️ *తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు*\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `📌 *అధికారిక నోటీస్ & ఆదేశాలు*\n\n` +
        `👤 *గ్రహీత:* ${name}\n` +
        `📂 *విభాగం:* ${category || 'సాధారణ రెవెన్యూ'}\n` +
        `📄 *రిఫరెన్స్ నంబర్:* ${ref}\n` +
        `📅 *పరిష్కార గడువు తేదీ:* ${dueDate}\n\n` +
        `⚠️ *గమనిక:* నిర్ణీత గడువులోగా తగిన నివేదికను కార్యాలయంలో సమర్పించవలసిందిగా ఆదేశించడమైనది.`;

      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> పంపుతున్నాము...';
      alertBox.style.display = 'none';

      try {
        const response = await fetch('https://api.github.com/repos/vijiyadav86-yogya/What-s-app-peddavadagur-mandal-/dispatches', {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'send_notice',
            client_payload: {
              phone: phone,
              message: noticeMessage
            }
          })
        });

        if (response.ok || response.status === 204) {
          alertBox.className = 'alert-success';
          alertBox.innerHTML = '✅ నోటీస్ విజయవంతంగా వాట్సాప్‌కు పంపబడింది!';
          alertBox.style.display = 'block';
        } else {
          throw new Error('API dispatch failed');
        }
      } catch (err) {
        alertBox.className = 'alert-error';
        alertBox.innerHTML = '⚠️ మెసేజ్ ట్రిగ్గర్ చేయబడింది! వర్క్‌ఫ్లో బ్యాక్‌గ్రౌండ్‌లో రన్ అవుతోంది.';
        alertBox.style.display = 'block';
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = '<i class="bi bi-whatsapp"></i> వాట్సాప్‌కు నోటీస్ పంపు';
      }
    }
  </script>
</body>
</html>
