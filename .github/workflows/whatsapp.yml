name: Send WhatsApp Notice

on:
  repository_dispatch:
    types: [send_notice]

jobs:
  send_whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp Message
        run: |
          python3 -c "
          import urllib.request, json

          raw_phone = '${{ github.event.client_payload.phone }}'.strip().replace('+', '').replace(' ', '')
          if not raw_phone.startswith('91') and len(raw_phone) == 10:
              phone = '91' + raw_phone
          else:
              phone = raw_phone

          url = 'https://graph.facebook.com/v19.0/1290612987479644/messages'
          headers = {
              'Authorization': 'Bearer ${{ secrets.WHATSAPP_TOKEN }}',
              'Content-Type': 'application/json'
          }
          data = {
              'messaging_product': 'whatsapp',
              'to': phone,
              'type': 'template',
              'template': {
                  'name': 'hello_world',
                  'language': { 'code': 'en_US' }
              }
          }

          req = urllib.request.Request(url, data=json.dumps(data).encode('utf-8'), headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  print(resp.read().decode())
          except urllib.error.HTTPError as e:
              print(e.read().decode())
              exit(1)
          "
          
