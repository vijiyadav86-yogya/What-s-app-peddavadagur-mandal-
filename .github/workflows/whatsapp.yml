name: Send WhatsApp Notice

on:
  repository_dispatch:
    types: [send_notice]

jobs:
  send_whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp Document Notice
        run: |
          python3 -c "
          import urllib.request, json, os, mimetypes

          raw = '${{ github.event.client_payload.phone }}'.strip().replace('+', '').replace(' ', '')
          phone = '91' + raw if len(raw) == 10 else raw

          msg = '''${{ github.event.client_payload.message }}'''
          file_url = '${{ github.event.client_payload.file_url }}'.strip()
          
          phone_number_id = '1290612987479644'
          token = '${{ secrets.WHATSAPP_TOKEN }}'

          media_id = None

          # ఫైల్ లింక్ ఉంటే ముందుగా డౌన్‌లోడ్ చేసి WhatsApp Media API కి అప్‌లోడ్ చేస్తాం
          if file_url and file_url.startswith('http'):
              try:
                  req_file = urllib.request.Request(file_url, headers={'User-Agent': 'Mozilla/5.0'})
                  file_data = urllib.request.urlopen(req_file).read()
                  
                  # WhatsApp Media Upload API
                  boundary = '----WebKitFormBoundary7MA4YWxkTrZu0gW'
                  c_type = 'application/pdf' if not any(file_url.lower().endswith(x) for x in ['.jpg', '.png']) else 'image/jpeg'
                  f_name = 'Notice_Document.pdf'

                  body = []
                  body.append(f'--{boundary}'.encode())
                  body.append(b'Content-Disposition: form-data; name=\"messaging_product\"\r\n\r\nwhatsapp')
                  body.append(f'--{boundary}'.encode())
                  body.append(f'Content-Disposition: form-data; name=\"file\"; filename=\"{f_name}\"\r\nContent-Type: {c_type}\r\n'.encode())
                  body.append(file_data)
                  body.append(f'--{boundary}--\r\n'.encode())
                  
                  payload_bytes = b'\r\n'.join(body)

                  upload_url = f'https://graph.facebook.com/v19.0/{phone_number_id}/media'
                  up_req = urllib.request.Request(upload_url, data=payload_bytes, headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': f'multipart/form-data; boundary={boundary}'
                  })
                  
                  with urllib.request.urlopen(up_req) as up_res:
                      res_json = json.loads(up_res.read().decode())
                      media_id = res_json.get('id')
                      print('Uploaded Media ID:', media_id)
              except Exception as e:
                  print('Media Upload Error:', str(e))

          # మెసేజ్ పంపే విభాగం
          msg_url = f'https://graph.facebook.com/v19.0/{phone_number_id}/messages'
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json'
          }

          if media_id:
              # Media ID ద్వారా డైరెక్ట్ PDF డాక్యుమెంట్ డెలివరీ
              data = {
                  'messaging_product': 'whatsapp',
                  'recipient_type': 'individual',
                  'to': phone,
                  'type': 'document',
                  'document': {
                      'id': media_id,
                      'caption': msg,
                      'filename': 'Notice_Document.pdf'
                  }
              }
          else:
              # మీడియా ఫెయిల్ అయితే సాధారణ మెసేజ్
              data = {
                  'messaging_product': 'whatsapp',
                  'recipient_type': 'individual',
                  'to': phone,
                  'type': 'text',
                  'text': {'body': msg + ('\n\n📄 ఫైల్ లింక్: ' + file_url if file_url else '')}
              }

          req = urllib.request.Request(msg_url, data=json.dumps(data).encode('utf-8'), headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Message Sent Successfully:', resp.read().decode())
          except urllib.error.HTTPError as e:
              print('Send Error:', e.read().decode())
          "
