name: Send WhatsApp Notice

on:
  repository_dispatch:
    types: [send_notice]

jobs:
  send_whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp Notice
        run: |
          python3 -c "
          import urllib.request, json, re

          raw = '${{ github.event.client_payload.phone }}'.strip().replace('+', '').replace(' ', '')
          phone = '91' + raw if len(raw) == 10 else raw

          msg = '''${{ github.event.client_payload.message }}'''
          file_url = '${{ github.event.client_payload.file_url }}'.strip()
          
          # WhatsApp API లో ఫైల్ పేరు తప్పనిసరిగా ఆంగ్లంలో ఉండాలి
          clean_name = 'Notice_Document.pdf'

          url = 'https://graph.facebook.com/v19.0/1290612987479644/messages'
          headers = {
              'Authorization': 'Bearer ${{ secrets.WHATSAPP_TOKEN }}',
              'Content-Type': 'application/json'
          }

          if file_url and file_url.startswith('http'):
              payload = {
                  'messaging_product': 'whatsapp',
                  'recipient_type': 'individual',
                  'to': phone,
                  'type': 'document',
                  'document': {
                      'link': file_url,
                      'caption': msg,
                      'filename': clean_name
                  }
              }
          else:
              payload = {
                  'messaging_product': 'whatsapp',
                  'recipient_type': 'individual',
                  'to': phone,
                  'type': 'text',
                  'text': {'body': msg}
              }

          req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Success:', resp.read().decode())
          except urllib.error.HTTPError as e:
              err = e.read().decode()
              print('WhatsApp API Error:', err)
              # ఒకవేళ డాక్యుమెంట్ ఏదైనా కారణంతో ఫెయిల్ అయితే వెంటనే టెక్స్ట్ అయినా వెళ్లేలా బ్యాకప్
              backup_payload = {
                  'messaging_product': 'whatsapp',
                  'recipient_type': 'individual',
                  'to': phone,
                  'type': 'text',
                  'text': {'body': msg + '\n\n📎 నోటీస్ డౌన్‌లోడ్ లింక్:\n' + file_url}
              }
              req_backup = urllib.request.Request(url, data=json.dumps(backup_payload).encode('utf-8'), headers=headers)
              urllib.request.urlopen(req_backup)
          "
