name: Send WhatsApp Notice

on:
  repository_dispatch:
    types: [send_notice]

jobs:
  send_whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Send Message via WhatsApp Cloud API
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          RECIPIENT_PHONE: ${{ github.event.client_payload.phone }}
          MESSAGE_TEXT: ${{ github.event.client_payload.message }}
        run: |
          PAYLOAD=$(jq -n \
            --arg phone "$RECIPIENT_PHONE" \
            --arg msg "$MESSAGE_TEXT" \
            '{
              messaging_product: "whatsapp",
              recipient_type: "individual",
              to: $phone,
              type: "text",
              text: { body: $msg }
            }')

          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v19.0/1290612987479644/messages" \
            -H "Authorization: Bearer ${WHATSAPP_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"error"'; then
            exit 1
          fi
          
